---
layout: wrapper
---

<div class="content">
    <div class="hero">
        <div class="container">

            {% if page.image %}
            <img
                src="{{ page.image | relative_url }}"
                class="hero-image"
                alt="{{ page.image_alt }}"
            >
            {% endif %}

            <h1>{{ page.title }}</h1>

            {{ content }}

        </div>
    </div>
</div>
