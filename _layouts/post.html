---
layout: wrapper
---

<div class="content">
    <div class="hero">
        <div class="container">

            {% if page.image %}
            <img
                src="{{ page.image | relative_url }}"
                class="hero-image"
                alt="{{ page.image_alt }}">
            {% endif %}

            <h1>{{ page.title }}</h1>
            <div class="article-content">
                {{ content }}
            </div>
        </div>
    </div>
</div>
