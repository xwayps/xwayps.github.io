---
layout: wrapper
---

<div class="content">
    <div class="hero">
        <div class="container">
            <div class="hero-image-container">
            {% if page.image %}
            <img
                src="{{ page.image | relative_url }}"
                class="hero-image"
                alt="{{ page.image_alt }}">
                <span class="hero-image-gradient"></span>
            {% endif %}
            </div>

            <h1>{{ page.title }}</h1>
            <p class="page-date">
            {{ page.date | date: "%-d %B %Y" }}
          </p>
            
            <div class="article-content">
                {{ content }}
            </div>
        </div>
    </div>
</div>
