---
layout: wrapper
---

<div class="content">

    <div class="carousel">
        <div class="container">

            
            {% assign recent_posts = site.posts | where_exp: "post", "post.image" | sort: "date" | reverse %}

{% if recent_posts.size > 0 %}
<div class="hero-carousel">

    <div class="carousel-controls">
        <button class="carousel-prev">Back</button>
        <div class="carousel-dots"></div>
        <button class="carousel-next">Next</button>
    </div>

    <div class="carousel-image-container">

        {% for post in recent_posts limit: 3 %}
        <a
            href="{{ post.url | relative_url }}"
            class="carousel-image-link{% if forloop.first %} active{% endif %}"
            aria-label="{{ post.title | escape }}">

            <img
                src="{{ post.image | relative_url }}"
                alt="{{ post.image_alt | default: post.title | default: 'Post thumbnail' | escape }}"
                loading="lazy"
                class="carousel-image">

        </a>
        {% endfor %}

    </div>

</div>
{% endif %}

            <h1>OUR CAUSE</h1>

            {{ content }}

            <a
                href="https://cryptpad.fr/form/#/2/form/view/3a1ZKtvuxS3UzrXCKtUnycxr9vu818iuurrfDSboPjo/"
                target="_blank" class="join-link">JOIN OUR FIGHT →</a>
            <a
                href="https://donorbox.org/inlo-general-fund"
                target="_blank" class="join-link">DONATE →</a>

        </div>
    </div>
</div>

<script nonce="{{ site.csp_nonce }}">
document.addEventListener('DOMContentLoaded', () => {
    const carousel = document.querySelector('.hero-carousel');

    if (!carousel) return;

    const slides = carousel.querySelectorAll('.carousel-image-link');
    const prev = carousel.querySelector('.carousel-prev');
    const next = carousel.querySelector('.carousel-next');
    const dotsContainer = carousel.querySelector('.carousel-dots');

    if (!slides.length || !dotsContainer || !prev || !next) return;

    let currentSlide = 0;
    let autoplayTimer;

    const autoplayDelay = 5000;

    // Remove any previously generated dots.
    dotsContainer.replaceChildren();

    // Create one dot for each slide.
    slides.forEach((slide, index) => {
        const dot = document.createElement('button');

        dot.type = 'button';
        dot.classList.add('carousel-dot');
        dot.setAttribute('aria-label', `Go to slide ${index + 1}`);
        dot.textContent = '•';

        dot.addEventListener('click', () => {
            showSlide(index);
            resetAutoplay();
        });

        dotsContainer.appendChild(dot);
    });

    const dots = dotsContainer.querySelectorAll('.carousel-dot');

    function showSlide(index) {
        currentSlide = (index + slides.length) % slides.length;

        slides.forEach((slide, i) => {
            slide.classList.toggle('active', i === currentSlide);
        });

        dots.forEach((dot, i) => {
            const active = i === currentSlide;

            dot.classList.toggle('active', active);
            dot.setAttribute('aria-current', active ? 'true' : 'false');
        });
    }

    function changeSlide(direction) {
        showSlide(currentSlide + direction);
    }

    function resetAutoplay() {
        clearInterval(autoplayTimer);

        autoplayTimer = setInterval(() => {
            changeSlide(1);
        }, autoplayDelay);
    }

    prev.addEventListener('click', () => {
        changeSlide(-1);
        resetAutoplay();
    });

    next.addEventListener('click', () => {
        changeSlide(1);
        resetAutoplay();
    });

    showSlide(0);
    resetAutoplay();
});
</script>
