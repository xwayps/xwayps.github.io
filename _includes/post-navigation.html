
<nav class="post-navigation">
  <div class="post-nav-previous">
    {% if page.previous %}
      <span>Previous article</span>
      <a href="{{ page.previous.url | relative_url }}">
        {{ page.previous.title }}
      </a>
    {% endif %}
  </div>

  <div class="post-nav-next">
    {% if page.next %}
      <span>Next article</span>
      <a href="{{ page.next.url | relative_url }}">
        {{ page.next.title }}
      </a>
    {% endif %}
  </div>
</nav>
